services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "npm run seed && npm run dev"]
    depends_on:
      - mailpit
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_FROM: "${SMTP_FROM:-noreply@example.com}"
    ports:
      - "5000:5000"
    volumes:
      - user-data:/app/data
      - ./src:/app/src
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://api:5000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/index.html:/app/index.html
      - ./frontend/src:/app/src

volumes:
  user-data:
